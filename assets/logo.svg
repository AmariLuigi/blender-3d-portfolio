<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- 3D Cube Facet Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4db"/>
      <stop offset="100%" stop-color="#e5c07b"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b89329"/>
      <stop offset="100%" stop-color="#5a4409"/>
    </linearGradient>
    
    <!-- Inner Core Glow -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e5c07b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Badge Gold Gradient -->
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c07b"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#e5c07b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 3D Isometric Monogram Icon -->
  <g transform="translate(10, 6)" filter="url(#shadow3D)">
    <!-- Top Face -->
    <polygon points="26,6 48,18 26,30 4,18" fill="url(#topFace)"/>
    <!-- Left Face (Stylized L facet) -->
    <polygon points="4,18 26,30 26,52 4,40" fill="url(#leftFace)"/>
    <!-- Right Face -->
    <polygon points="26,30 48,18 48,40 26,52" fill="url(#rightFace)"/>
    <!-- Floating Kinetic Core Apex -->
    <polygon points="26,13 36,19 26,25 16,19" fill="url(#coreGlow)"/>
    <!-- Geometric Edge Inset Accent -->
    <polyline points="4,18 26,30 48,18" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="26" y1="30" x2="26" y2="52" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
  </g>

  <!-- Brand Typography -->
  <!-- "LUIGI" -->
  <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.02em" fill="#ffffff">
    LUIGI
  </text>

  <!-- "3D" Metallic Badge -->
  <g transform="translate(148, 17)">
    <rect width="44" height="26" rx="6" fill="url(#badgeGold)"/>
    <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" letter-spacing="0.04em" fill="#090a0d" text-anchor="middle">
      3D
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="75" y="52" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" letter-spacing="0.22em" text-transform="uppercase" fill="#a1a1aa">
    ARTIST &amp; MOTION DESIGN
  </text>
</svg>
