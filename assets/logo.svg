<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 56" fill="none" width="100%" height="100%">
  <defs>
    <!-- Platinum Mirror Top Face -->
    <linearGradient id="platTop" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Warm Champagne Gold Left Facet (L form) -->
    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae7b9"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7c6014"/>
    </linearGradient>

    <!-- Deep Titanium Bronze Right Facet (A form) -->
    <linearGradient id="bronzeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfba63"/>
      <stop offset="50%" stop-color="#997525"/>
      <stop offset="100%" stop-color="#45330a"/>
    </linearGradient>

    <!-- Inner Floating Optical Gem Core -->
    <linearGradient id="corePrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Subtle Luxury Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d4af37" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 3D Kinetic Architectural Monogram Mark -->
  <g transform="translate(6, 4)" filter="url(#softGlow)">
    <!-- Top Face (Reflective Platinum Horizon) -->
    <polygon points="24,4 44,15 24,26 4,15" fill="url(#platTop)"/>
    
    <!-- Left Facet (Gold Sculptural Column) -->
    <polygon points="4,15 24,26 24,44 4,33" fill="url(#goldLeft)"/>
    
    <!-- Right Facet (Titanium Shadow Facet) -->
    <polygon points="24,26 44,15 44,33 24,44" fill="url(#bronzeRight)"/>

    <!-- Central Precision Optical Inset -->
    <polygon points="24,11 34,16.5 24,22 14,16.5" fill="url(#corePrism)"/>

    <!-- Specular Chamfer Light Lines -->
    <polyline points="4,15 24,26 44,15" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.85"/>
    <line x1="24" y1="26" x2="24" y2="44" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5"/>
    <line x1="4" y1="15" x2="4" y2="33" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.35"/>
  </g>

  <!-- Elegant Vertical Hairline Divider -->
  <line x1="68" y1="13" x2="68" y2="43" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- Artist Identity Wordmark -->
  <!-- Name: LUIGI AMARI -->
  <text x="84" y="27" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="700" font-size="17" letter-spacing="0.16em" fill="#ffffff">
    LUIGI AMARI
  </text>

  <!-- Discipline: 3D ARTIST & MOTION DESIGNER -->
  <text x="84.5" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="500" font-size="8.5" letter-spacing="0.25em" fill="#a1a1aa">
    3D ARTIST &amp; MOTION DESIGNER
  </text>
</svg>
