<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Vignette Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#191c26"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </radialGradient>

    <!-- Metallic Facet Shaders -->
    <linearGradient id="iconPlatTop" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="iconGoldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae7b9"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7c6014"/>
    </linearGradient>

    <linearGradient id="iconBronzeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfba63"/>
      <stop offset="50%" stop-color="#997525"/>
      <stop offset="100%" stop-color="#45330a"/>
    </linearGradient>

    <linearGradient id="iconCorePrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="iconDepth" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d4af37" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Container -->
  <rect width="64" height="64" rx="16" fill="url(#iconBg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="rgba(255,255,255,0.12)"/>

  <!-- 3D Kinetic Architectural Monogram Mark (Centered) -->
  <g transform="translate(8, 8)" filter="url(#iconDepth)">
    <!-- Top Face (Reflective Platinum Horizon) -->
    <polygon points="24,4 44,15 24,26 4,15" fill="url(#iconPlatTop)"/>
    
    <!-- Left Facet (Champagne Gold Sculptural Column) -->
    <polygon points="4,15 24,26 24,44 4,33" fill="url(#iconGoldLeft)"/>
    
    <!-- Right Facet (Titanium Shadow Facet) -->
    <polygon points="24,26 44,15 44,33 24,44" fill="url(#iconBronzeRight)"/>

    <!-- Central Precision Optical Inset -->
    <polygon points="24,11 34,16.5 24,22 14,16.5" fill="url(#iconCorePrism)"/>

    <!-- Specular Chamfer Light Lines -->
    <polyline points="4,15 24,26 44,15" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.9"/>
    <line x1="24" y1="26" x2="24" y2="44" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.55"/>
    <line x1="4" y1="15" x2="4" y2="33" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.35"/>
  </g>
</svg>
